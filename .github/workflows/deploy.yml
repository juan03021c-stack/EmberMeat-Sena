name: Deploy EmberMeat

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Preparar conexión SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Actualizar y publicar el sitio
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -e

            git -C /opt/embermeat-repo pull --ff-only origin main

            npm ci --prefix /opt/embermeat-repo/ember-meats-admin

            npm run build --prefix /opt/embermeat-repo/ember-meats-admin

            # Antes de copiar, confirmar que este usuario puede escribir en el sitio;
            # si no, se explica cómo arreglarlo en vez de fallar a mitad de camino.
            for carpeta in /var/www/embermeat.site /var/www/embermeat.site/assets /var/www/embermeat.site/backend; do
              if [ -d "$carpeta" ] && [ ! -w "$carpeta" ]; then
                echo "Sin permiso de escritura en $carpeta para el usuario $(whoami)."
                echo "Arreglo (una sola vez, en el servidor): sudo chown -R $(whoami):www-data /var/www/embermeat.site"
                exit 1
              fi
            done

            # Las carpetas y archivos del sitio pueden ser de otro usuario: solo se copia el contenido
            # (-rl + --checksum) sin intentar cambiar fechas, permisos ni dueño.
            rsync -rl --checksum --omit-dir-times \
              /opt/embermeat-repo/ember-meats-admin/dist/ \
              /var/www/embermeat.site/

            rsync -rl --checksum --omit-dir-times --delete \
              --exclude='Config/Database.php' \
              --exclude='Config/Correo.php' \
              --exclude='uploads/' \
              /opt/embermeat-repo/backend/ \
              /var/www/embermeat.site/backend/
          REMOTE

